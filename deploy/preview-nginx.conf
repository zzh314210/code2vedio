# Isolated acceptance environment; production remains on HTTPS 443.
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name vedio.myaihub.asia;
    ssl_certificate /etc/letsencrypt/live/vedio.myaihub.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedio.myaihub.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 512m;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ^~ /internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:7861;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
