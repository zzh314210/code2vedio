[Service]
Slice=code2vedio.slice
CPUQuota=infinity
MemoryMax=infinity
MemorySwapMax=infinity
ReadWritePaths=/data/code2vedio/.runtime
Environment=C2V_QUEUE_ENABLED=1
Environment=C2V_QUEUE_DIR=/data/code2vedio/.runtime
Environment=C2V_QUEUE_NAMESPACE=production
Environment=C2V_QUEUE_MIN_AVAILABLE_MB=768
Environment=C2V_RENDER_CGROUP_PARENT=code2vedio.slice
Environment=C2V_RENDER_CPUS=2.5
Environment=C2V_RENDER_MEMORY=2g
Environment=C2V_RENDER_MEMORY_SWAP=6g
