server {
    listen 80;
    listen [::]:80;
    server_name vedio.myaihub.asia;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vedio.myaihub.asia;
    ssl_certificate /etc/letsencrypt/live/vedio.myaihub.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedio.myaihub.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/vedio.myaihub.asia.access.log;
    error_log /var/log/nginx/vedio.myaihub.asia.error.log;
    client_max_body_size 512m;
    auth_basic "Frame Studio";
    auth_basic_user_file /etc/nginx/code2vedio.htpasswd;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
